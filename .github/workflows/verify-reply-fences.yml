name: Verify reply fence fix on Linux
on:
  push:
    branches: [verify/reply-table-fences-linux]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    env:
      CI: "true"
      OMB_VITEST_WORKERS: "4"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 84b4b08992590a825250e099ea11e6d99f530f47
          persist-credentials: false
      - run: |
          test "$(git rev-parse HEAD)" = 84b4b08992590a825250e099ea11e6d99f530f47
          target="$(mktemp -d)"
          ln -s "$target" "$target-link"
          test -L "$target-link"
          unlink "$target-link"
          rmdir "$target"
      - uses: pnpm/action-setup@ff378ebe6b225b0680b81c1ad4498ae0d1d3a5e3
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec vitest run --shard=${{ matrix.shard }}/8
      - if: matrix.shard == 1
        run: pnpm typecheck && pnpm broker:test && pnpm test:electron && pnpm test:packaged-server

